<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Seismic — Game Publishing Lifecycle Platform. Walk a game from concept to long-tail revenue with evidence at every gate.">
<meta property="og:title" content="Seismic — Game Publishing Lifecycle Platform">
<title>Seismic — Echoes of the Abyss · Abyss Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/seismic.css?v=6">
<script src="/track.js" data-tool="seismic" data-version="1"></script>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div id="topbar">
  <div class="brand" onclick="navigate('dashboard')">Seismic <span>//</span></div>
  <div id="lifecycle-nav">
    <div class="lc-stage" data-stage="1" onclick="navigateStage(1)"><span class="lc-num">1</span>Concept</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="2" onclick="navigateStage(2)"><span class="lc-num">2</span>Pre-prod</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="3" onclick="navigateStage(3)"><span class="lc-num">3</span>First Playable</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="4" onclick="navigateStage(4)"><span class="lc-num">4</span>Pre-Alpha</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="5" onclick="navigateStage(5)"><span class="lc-num">5</span>Closed Beta</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="6" onclick="navigateStage(6)"><span class="lc-num">6</span>Open Beta</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="7" onclick="navigateStage(7)"><span class="lc-num">7</span>Launch</div>
    <div class="lc-gate-dot"></div>
    <div class="lc-stage" data-stage="8" onclick="navigateStage(8)"><span class="lc-num">8</span>Post-Launch</div>
  </div>
  <div id="topbar-right">
    <div style="text-align:right">
      <div class="score-badge" id="momentum-score-display">—</div>
      <div class="score-label">Momentum Score</div>
    </div>
  </div>
</div>

<!-- ===== APP LAYOUT ===== -->
<div id="app-layout">
  <div id="sidebar"></div>
  <div id="main-content"></div>
</div>

<!-- ===== GATE MODAL ===== -->
<div id="gate-modal" class="modal-overlay" style="display:none"></div>

<script>
document.getElementById('main-content').innerHTML = '<div style="padding:2rem"><h3 style="color:var(--gold)">Loading...</h3></div>';
</script>
<script src="js/data.js?v=6"></script>
<script>
var mc = document.getElementById('main-content');
mc.innerHTML += '<p>' + (typeof GATE_LOG !== 'undefined' ? '✓ data.js OK' : '✗ data.js FAILED') + '</p>';
mc.innerHTML += '<p>' + (typeof THESIS !== 'undefined' ? '✓ THESIS OK' : '✗ THESIS missing') + '</p>';
</script>
<script src="js/app.js?v=6"></script>
<script>
mc.innerHTML += '<p>' + (typeof navigate !== 'undefined' ? '✓ app.js OK' : '✗ app.js FAILED') + '</p>';
</script>
<script>
/* Game OS instrumentation — seismic journey:
   stage_entered -> tool_opened -> gate_decision -> thesis_revised */
(function () {
  if (typeof window.gosTrack !== 'function') return;
  window.gosTrack('tool_session_start', { entry_source: document.referrer || null });

  if (typeof window.navigateStage === 'function') {
    var origStage = window.navigateStage;
    window.navigateStage = function (stage) {
      window.gosTrack('journey_step', { step_name: 'stage_entered', step_index: 1, stage: stage });
      return origStage.apply(this, arguments);
    };
  }
  if (typeof window.navigate === 'function') {
    var origNav = window.navigate;
    window.navigate = function (screen) {
      window.gosTrack('journey_step', { step_name: 'tool_opened', step_index: 2, screen: screen });
      return origNav.apply(this, arguments);
    };
  }
  if (typeof window.handleGateDecision === 'function') {
    var origGate = window.handleGateDecision;
    window.handleGateDecision = function (stage, decision) {
      window.gosTrack('gate_decision', { stage: stage, decision: decision });
      if (decision === 'revise') {
        window.gosTrack('thesis_revised', { stage: stage });
      }
      window.gosTrack('journey_complete', { stage: stage, decision: decision });
      return origGate.apply(this, arguments);
    };
  }
  if (typeof window.handleTerminalGate === 'function') {
    var origTerm = window.handleTerminalGate;
    window.handleTerminalGate = function (decision) {
      window.gosTrack('gate_decision', { stage: 8, decision: decision, terminal: true });
      window.gosTrack('journey_complete', { stage: 8, decision: decision, terminal: true });
      return origTerm.apply(this, arguments);
    };
  }
})();
</script>
</body>
</html>
