<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMF Analyzer — Indie Games</title>
  <script type="module" crossorigin src="/game-os/PMF/assets/index-CgKmM8p4.js"></script>
  <link rel="stylesheet" crossorigin href="/game-os/PMF/assets/index-DcKGvbA1.css">
<script src="/track.js" data-tool="pmf" data-version="1"></script>
</head>
<body><div id="root"></div></body>
<script>
/* Game OS instrumentation — PMF journey:
   app_id_entered -> analysis_run -> report_viewed -> report_actioned */
(function () {
  if (typeof window.gosTrack !== 'function') return;
  var startedAt = Date.now();
  var S = { entered: false, run: false, viewed: false, actioned: false };
  function once(k, fn) { if (!S[k]) { S[k] = true; fn(); } }

  // Wrap fetch to catch the analyze call (analysis_run) and its result
  var origFetch = window.fetch;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var isAnalyze = url.indexOf('/analyze') !== -1;
    if (isAnalyze) {
      var appId = null;
      try { appId = JSON.parse((init && init.body) || '{}').app_id || null; } catch (e) {}
      once('entered', function () { window.gosTrack('journey_step', { step_name: 'app_id_entered', step_index: 1, app_id: appId }); });
      once('run', function () { window.gosTrack('analysis_run', { app_id: appId }); });
    }
    return origFetch.apply(this, arguments);
  };

  // report_viewed — once the results DOM fills in
  var mo = new MutationObserver(function () {
    var root = document.getElementById('root');
    if (root && root.textContent && root.textContent.length > 400 && /\d/.test(root.textContent)) {
      once('viewed', function () {
        window.gosTrack('journey_step', { step_name: 'report_viewed', step_index: 3 });
        window.gosTrack('report_viewed', {});
        window.gosTrack('journey_complete', { duration_seconds: Math.round((Date.now() - startedAt) / 1000) });
      });
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });

  // output_action on export/share/copy buttons (text-based detection)
  document.addEventListener('click', function (e) {
    var t = (e.target && e.target.textContent || '').toLowerCase();
    if (/export|download|share|copy/.test(t) && S.viewed) {
      once('actioned', function () { window.gosTrack('report_actioned', {}); });
      var action = /export|download/.test(t) ? 'export' : (/share/.test(t) ? 'share' : 'copy');
      window.gosTrack('output_action', { action: action });
    }
  }, true);

  window.gosTrack('tool_session_start', { entry_source: document.referrer || null });
})();
</script>
</html>
